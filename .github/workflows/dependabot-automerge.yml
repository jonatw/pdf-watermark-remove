# Auto-merge dependabot PRs once CI is green (patch/minor only).
# Major bumps are left open for human/agent review.
name: dependabot-automerge
on: pull_request
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # One API call now, not a 30-minute poll.
    timeout-minutes: 5
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: meta
      - name: Enable auto-merge (patch/minor)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        # Renamed from "Merge after CI passes": this step does not wait for anything.
        # `--auto` hands enforcement to GitHub, which gates on every required check plus
        # the approval — so the poll that used to live here added no safety on top of
        # that, while holding a hosted runner open for up to 30 minutes per PR to watch
        # something GitHub watches for free.
        #
        # The poll was also actively harmful: it waited for the check to go green before
        # calling `--auto`, i.e. it maximised the chance the PR was ALREADY mergeable by
        # then, and `enablePullRequestAutoMerge` is reported to fail with "Pull request is
        # in clean status" in exactly that case — the same red X that adding `--auto` set
        # out to remove. Calling immediately, while checks are still pending, cannot hit
        # that window.
        #
        # Trade-off accepted: a FAILING check no longer produces a red run here. Auto-merge
        # just never fires and the PR stays open.
        # NOTE: unlike pdf-processor, this repo has NO close-stale-prs.yml, so nothing
        # sweeps such a PR — it sits open until someone looks. Accepted here because a
        # stuck dependabot PR is visible and harmless; revisit if they pile up.
        #
        run: gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --squash --auto
