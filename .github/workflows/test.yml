name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"  # match the real runtime: WASM wheel is cp313 (pyodide 0.29.x)
      - run: pip install -r requirements.txt
      - run: python -m unittest tests -v
