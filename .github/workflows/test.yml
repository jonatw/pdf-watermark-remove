name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Pin lives in .python-version (a regular file) so version bumps don't
          # require editing this workflow — coding agents lack `workflows` scope.
          # Keep in sync with pdf-processor's real WASM runtime (cp314 / Python 3.14).
          python-version-file: .python-version
      - run: pip install -r requirements.txt
      - run: python -m unittest tests -v
